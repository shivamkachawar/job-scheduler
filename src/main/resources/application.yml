spring:
  application:
    name: job-scheduler

  datasource:
    url: jdbc:postgresql://localhost:5432/job_scheduler
    username: scheduler_user
    password: growth@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration